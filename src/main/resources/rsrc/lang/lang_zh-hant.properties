# Error messages
error.game_launch="遊戲無法啟動。\n\n建議嘗試以下任一解決方法（不分先後）：\n- 在啟動器設定的「遊戲」分頁中，點擊「載入推薦設定」按鈕。\n- 在啟動器設定的「遊戲」分頁中，降低分配的記憶體。\n- 在啟動器設定的「遊戲」分頁中，點擊「恢復預設值」按鈕。\n- 在啟動器設定的「遊戲」分頁中，修補另一個 Java VM。\n\n如果仍然無法解決問題，你可以在 Discord 上尋求技術支援。\n\n透過 Discord 尋求協助時，請務必附上你的所有日誌檔案。\n你可以透過啟動器的 設定 → 關於 → 複製日誌到剪貼簿 自動取得所有日誌，然後在 Discord 中按 CTRL + V 貼上。"
error.start_location=".jar 檔案似乎放在錯誤的目錄中。\n某些情況下這是誤判，可以忽略。Knight Launcher 將嘗試正常啟動。\n如果此問題持續發生，請嘗試在 Windows 上使用批次檔（KnightLauncher_windows.bat），\n或在 OSX/Linux 上使用 Shell 檔（KnightLauncher_mac_linux.sh）。"
error.start_location_steam_path="\n此外，我們偵測到以下 Steam 路徑：\n{0}"
error.flamingo_offline="無法連線到 Flamingo。\n啟動器的部分功能可能無法完全使用。"
error.folders_within_mods_folder="模組資料夾中有資料夾。\n你不需要解壓縮 .zip 檔案，只需將 .zip 檔案拖放到模組資料夾中即可。"
error.unsupported_64bit="你的系統不支援修補 64 位元 Java VM。"
error.not_supported="不支援。"
error.launcher_already_running="Knight Launcher 已在執行中。\n請在工作列或系統匣中尋找。"
error.game_already_running_launch="Spiral Knights 已在執行中。\n若要啟動另一個用戶端，請在點擊遊玩時按住 ALT 鍵（macOS 上為 OPTION 鍵）或 SHIFT 鍵，以分身模式啟動。"
error.mod_file_format="僅支援 .zip、.jar 和 .modpack 副檔名，請再試一次。"

