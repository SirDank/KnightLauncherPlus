m.scene_editor_legacy_warning="Verwende diesen alten Szenen-Editor nicht, um Inhalte zu erstellen, die du beim Crucible-Programm des Kolosseums einreichen möchtest.\nVerwende stattdessen den Crucible-Editor, der im Spiel erreichbar ist.\n\nDieser alte Editor kann jederzeit nicht mehr funktionieren, und zukünftiger Support ist nicht garantiert.\n\nMöchtest du fortfahren?"
m.crucible_editor_warning="Der Crucible-Editor wird ausschließlich von Grey Havens gepflegt, und dieser Launcher wird von ihnen weder unterstützt noch steht er mit ihnen in Verbindung.\nDies ist lediglich eine Verknüpfung zum selben Editor, den du auch im Spiel öffnen würdest.\n\nDie Nutzung des Crucible-Editors außerhalb des Spiels wird offiziell nicht unterstützt...\nEs kann sein, dass nicht alles richtig funktioniert, Nutzung auf eigenes Ermessen.\n\nAlles, was du erstellst, muss den Nutzungsbedingungen des Coliseum Crucible entsprechen:\nhttps://wiki.spiralknights.com/Coliseum_Crucible_Terms_and_Conditions\n\nStelle sicher, dass Fehler, die du melden möchtest, auch auftreten, wenn der Editor im Spiel gestartet wird.\n\nMöchtest du fortfahren?"
m.scheduled_maintenance_warning="Die Spielserver befinden sich derzeit in einem Wartungsfenster.\nIn deiner Spielsitzung kann es zu Unterbrechungen kommen, oder du kannst dich eventuell gar nicht anmelden.\n\nDie Wartung endet um: {0}. (angezeigt in deiner Ortszeit)\n\nDie obige Zeit ist eine offizielle Schätzung, sie kann sich aber immer ändern.\nWeitere Informationen findest du in den Spielforen."
m.invalid_additional_args_warning="Ein oder mehrere JVM-Argumente in deiner Einstellung für zusätzliche Argumente (Extra.txt) sind ungültig.\n\nBitte gehe zu Einstellungen → Erweitert und überprüfe sie. Weitere Informationen findest du in den Logs von Knight Launcher.\n\nAlle werden bei diesem Start ignoriert."
m.invalid_additional_args_save_warning="Ein oder mehrere JVM-Argumente in deiner Einstellung für zusätzliche Argumente (Extra.txt) sind ungültig und wurden auf die Standardwerte zurückgesetzt.\n\nBitte gehe zu Einstellungen → Erweitert und überprüfe sie. Weitere Informationen findest du in den Logs von Knight Launcher."

