# Error messages
error.game_launch="Das Spiel konnte nicht gestartet werden.\n\nEs wird empfohlen, eine der folgenden Lösungen auszuprobieren (in beliebiger Reihenfolge):\n- Drücke im Tab \"Spiel\" der Launcher-Einstellungen auf \"Empfohlene Einstellungen laden\".\n- Verringere den zugewiesenen Speicher im Tab \"Spiel\" der Launcher-Einstellungen.\n- Drücke im Tab \"Spiel\" der Launcher-Einstellungen auf \"Auf Standardwerte zurücksetzen\".\n- Patche eine andere Java VM im Tab \"Spiel\" der Launcher-Einstellungen.\n\nWenn dein Problem dadurch nicht gelöst wird, kannst du auf Discord nach technischem Support fragen.\n\nWenn du auf Discord um Hilfe bittest, hänge unbedingt ALLE deine Log-Dateien an.\nDu erhältst ALLE Logs automatisch über Einstellungen → Über → Logs in die Zwischenablage kopieren und kannst sie dann mit STRG + V auf Discord einfügen."
error.start_location="Die .jar-Datei scheint im falschen Ordner zu liegen.\nIn manchen Fällen ist das ein Fehlalarm und kann ignoriert werden. Knight Launcher versucht, normal zu starten.\nWenn das weiterhin passiert, verwende die Batch-Datei (KnightLauncher_windows.bat) unter Windows\noder die Shell-Datei (KnightLauncher_mac_linux.sh) unter OSX/Linux."
error.start_location_steam_path="\nAußerdem haben wir folgenden Steam-Pfad erkannt: \n{0}"
error.flamingo_offline="Verbindung zu Flamingo fehlgeschlagen.\nEinige Funktionen des Launchers sind eventuell nicht vollständig verfügbar."
error.folders_within_mods_folder="Im Mod-Ordner befinden sich Ordner.\nDu musst die .zip-Datei nicht entpacken, ziehe die .zip-Datei einfach in den Mod-Ordner."
error.unsupported_64bit="Dein System unterstützt das Patchen einer 64-Bit-Java-VM nicht."
error.not_supported="Nicht unterstützt."
error.launcher_already_running="Knight Launcher läuft bereits.\nDu findest ihn in deiner Taskleiste oder im Infobereich."
error.game_already_running_launch="Spiral Knights läuft bereits.\nUm einen weiteren Client zu starten, halte die ALT-Taste (OPTION-Taste unter macOS) oder die SHIFT-Taste gedrückt, während du auf Spielen drückst, um im Alt-Modus zu starten."
error.mod_file_format="Es werden nur Dateien mit den Endungen .zip, .jar und .modpack unterstützt, bitte versuche es erneut."

