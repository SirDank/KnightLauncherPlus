m.scene_editor_legacy_warning="Ära kasuta seda vana stseeniredaktorit sisu loomiseks, mida kavatsed esitada Kolosseumi Crucible programmi.\nKasuta selle asemel mängusisest Crucible redaktorit.\n\nSee vana redaktor võib igal hetkel töötamast lakata ja selle edasine tugi ei ole tagatud.\n\nKas soovid jätkata?"
m.crucible_editor_warning="Crucible redaktorit haldab ainult Grey Havens ning see launcher ei ole nende poolt heaks kiidetud ega nendega seotud.\nSee on lihtsalt otsetee samale redaktorile, mille avaksid mängus.\n\nCrucible redaktori kasutamine väljaspool mängu ei ole ametlikult toetatud...\nKõik ei pruugi korralikult töötada, kasuta omal vastutusel.\n\nKõik sinu loomingud peavad vastama Coliseum Crucible kasutustingimustele:\nhttps://wiki.spiralknights.com/Coliseum_Crucible_Terms_and_Conditions\n\nVeendu, et vead, millest kavatsed teatada, korduvad ka siis, kui redaktor käivitatakse mängust.\n\nKas soovid jätkata?"
m.scheduled_maintenance_warning="Mänguserverites toimub hetkel hooldus.\nSinu mänguseansis võib esineda katkestusi või ei pruugi sa üldse sisse logida.\n\nHooldus lõpeb: {0}. (kuvatud sinu kohalikus ajas)\n\nÜlaltoodud aeg on ametlik hinnang, kuid see võib alati muutuda.\nLisateavet leiad mängu foorumitest."
m.invalid_additional_args_warning="Üks või mitu JVM-i argumenti sinu lisaargumentide (Extra.txt) sättes on vigased.\n\nMine Sätted → Täpsem ja vaata need üle. Lisateavet leiad Knight Launcheri logidest.\n\nSelle käivitamise ajal eiratakse neid kõiki."
