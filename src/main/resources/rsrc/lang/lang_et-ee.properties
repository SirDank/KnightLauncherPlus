# Error messages
error.invalid_dir="Sa pead selle .jar-faili paigutama Spiral Knights’i peakausta. {0}"
error.game_launch="Mängu ei õnnestunud käivitada.\n\nSoovitame proovida mõnda järgmistest lahendustest suvalises järjekorras:\n- Vajuta launcheri sätete vahekaardil \"Mäng\" nuppu \"Laadi soovitatud sätted\".\n- Vähenda eraldatud mälu launcheri sätete vahekaardil \"Mäng\".\n- Vajuta launcheri sätete vahekaardil \"Mäng\" nuppu \"Lähtesta vaikeväärtused\".\n- Paika launcheri sätete vahekaardil \"Mäng\" mõni teine Java VM.\n\nKui see ei lahenda sinu probleemi, võid otsida tehnilist tuge Discordist.\n\nDiscordis abi küsides lisa kindlasti KÕIK oma logifailid.\nKÕIK logid saad automaatselt kätte, kui avad launcheri Sätted → Teave → Kopeeri logid lõikelauale ning vajutad seejärel Discordis CTRL + V."
error.start_location="Tundub, et .jar-fail on vales kaustas.\nMõnikord on see valehäire ja seda võib eirata. Knight Launcher proovib tavapäraselt käivituda.\nKui see kordub, proovi kasutada Windowsis Batch-faili (KnightLauncher_windows.bat)\nvõi OSX/Linuxis Shell-faili (KnightLauncher_mac_linux.sh)."
error.start_location_steam_path="\nLisaks tuvastasime järgmise Steami asukoha: \n{0}"
error.flamingo_offline="Flamingoga ei õnnestunud ühendust luua.\nMõned launcheri funktsioonid ei pruugi täielikult saadaval olla."
error.no_compatible_jvm="Redaktori käivitamiseks puudub ühilduv Java VM."
error.folders_within_mods_folder="Modide kaustas on kaustu.\nZip-faili pole vaja lahti pakkida, lihtsalt lohista .zip-fail modide kausta."
error.unsupported_64bit="Sinu süsteem ei toeta 64-bitise Java VM-i paikamist."
error.not_supported="Ei ole toetatud."
error.launcher_already_running="Knight Launcher juba töötab.\nOtsi seda oma tegumiribalt või süsteemisalvest."
error.game_already_running="Spiral Knights juba töötab.\nSulge mäng enne Knight Launcheri avamist."
error.game_already_running_launch="Spiral Knights juba töötab.\nTeise kliendi käivitamiseks hoia Mängi vajutamise ajal all ALT-klahvi (macOS-is OPTION-klahvi) või SHIFT-klahvi, et käivitada Alt-režiimis."
