# Error messages
error.invalid_dir="Spiral Knightsメインディレクトリ内に「.jarファイル」が必要なので、ディレクトリ内にご配置ください！ {0}"
error.game_launch="ゲームを起動できませんでした。\n\n以下の解決方法を順不同でお試しください:\n- ランチャー設定の「ゲーム」タブで「推奨設定を読み込む」ボタンを押す。\n- ランチャー設定の「ゲーム」タブで割り当てメモリーを減らす。\n- ランチャー設定の「ゲーム」タブで「デフォルト値に戻す」ボタンを押す。\n- ランチャー設定の「ゲーム」タブで別のJava VMをパッチする。\n\nそれでも問題が解決しない場合は、Discordで技術サポートを受けることができます。\n\nDiscordでサポートを依頼する際は、必ずすべてのログファイルを添付してください。\nランチャーの 設定 → 情報 → ログをクリップボードにコピー ですべてのログを自動的に取得し、DiscordでCTRL + Vを押して貼り付けられます。"
error.start_location="この.jarファイルは間違ったディレクトリに置かれているようです。\n誤検知の場合もあるので、無視しても構いません。Knight Launcherは通常どおり起動を試みます。\nこの問題が続く場合は、WindowsではBatchファイル（KnightLauncher_windows.bat）を、\nOSX/LinuxではShellファイル（KnightLauncher_mac_linux.sh）を使用してみてください。"
error.start_location_steam_path="\nまた、次のSteamのパスを検出しました: \n{0}"
error.flamingo_offline="Flamingoに接続できませんでした。\n一部のランチャー機能が完全には利用できない可能性があります。"
error.no_compatible_jvm="エディターを起動できる互換性のあるJava VMがありません。"
error.folders_within_mods_folder="モドフォルダー内にフォルダーがあります。\n.zipファイルを展開する必要はありません。.zipファイルをそのままモドフォルダーにドラッグ＆ドロップしてください。"
error.unsupported_64bit="お使いのシステムは64ビットJava VMのパッチに対応していません。"
error.not_supported="サポートされていません。"
error.launcher_already_running="Knight Launcherはすでに実行中です。\nタスクバーまたはシステムトレイを確認してください。"
error.game_already_running="Spiral Knightsはすでに実行中です。\nKnight Launcherを開く前にゲームを終了してください。"
