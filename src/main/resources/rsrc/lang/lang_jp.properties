m.crucible_editor_warning="CrucibleエディターはGrey Havensによって独占的に管理されており、このランチャーは承認も提携もしていません。\nこれは、ゲーム内で開くのと同じエディターへのショートカットにすぎません。\n\nゲーム外からのCrucibleエディターの使用は公式にはサポートされていません...\n正しく動作しない場合もありますので、自己判断でご使用ください。\n\n作成したものはすべてColiseum Crucibleの利用規約に従う必要があります:\nhttps://wiki.spiralknights.com/Coliseum_Crucible_Terms_and_Conditions\n\n報告するバグは、ゲーム内からエディターを起動した場合にも再現できることを確認してください。\n\n続行しますか？"
m.scheduled_maintenance_warning="ゲームサーバーは現在メンテナンス中です。\nゲームセッションが中断されたり、まったくログインできなかったりする場合があります。\n\nメンテナンス終了時刻: {0}。（現地時間で表示）\n\n上記の時刻は公式の推定であり、変更される場合があります。\n詳しくはゲームのフォーラムをご確認ください。"
m.invalid_additional_args_warning="追加引数（Extra.txt）の設定に、無効なJVM引数が1つ以上見つかりました。\n\n設定 → 詳細設定 に移動して確認してください。詳しくはKnight Launcherのログをご覧ください。\n\n今回の起動ではすべて無視されます。"
