# Error messages
error.invalid_dir="Поместите данный .jar в папку игры Spiral Knights. {0}"
error.game_launch="Не удалось запустить игру.\n\nРекомендуется попробовать следующие способы в произвольном порядке (в настройках лаунчера, вкладка \"Игра\"):\n- Нажмите кнопку \"Рекомендуемые настройки\".\n- Уменьшите количество выделенной памяти.\n- Произведите сброс через кнопку \"Сброс настроек\".\n- Пропатчить Java VM используя другую версию.\n\nЕсли это не помогло исправить вашу проблему, вы можете обратиться за помощью в канале Discord."
error.start_location="Похоже запущенный вами .jar файл находится не в том месте.\nВ некоторых случаях это ложная ошибка и её можно игнорировать. Knight Launcher попробует запуститься в нормальном режиме.\nЕсли проблема сохраняется, попробуйте использовать bat-файл (KnightLauncher_windows.bat) для Windows\n или shell-скрипт (KnightLauncher_mac_linux.sh) для OSX/Linux."
error.start_location_steam_path="\nКроме того, мы обнаружили следующий путь Steam: \n{0}"
