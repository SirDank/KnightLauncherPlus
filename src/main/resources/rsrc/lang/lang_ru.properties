m.scene_editor_legacy_warning="Не используйте этот устаревший Редактор сцен для создания контента, который вы собираетесь отправить в программу Crucible Колизея.\nВместо этого используйте Редактор Crucible, доступный в игре.\n\nЭтот устаревший редактор может перестать работать в любой момент, и его дальнейшая поддержка не гарантируется.\n\nПродолжить?"
m.crucible_editor_warning="Редактор Crucible поддерживается исключительно Grey Havens, и этот лаунчер никак с ними не связан и не одобрен ими.\nЭто просто ярлык для доступа к тому же редактору, что открывается в игре.\n\nИспользование Редактора Crucible вне игры официально не поддерживается...\nВсё может работать или не работать корректно, используйте на своё усмотрение.\n\nВсе ваши творения должны соответствовать Условиям использования Coliseum Crucible:\nhttps://wiki.spiralknights.com/Coliseum_Crucible_Terms_and_Conditions\n\nУбедитесь, что ошибки, о которых вы собираетесь сообщить, воспроизводятся при запуске редактора из игры.\n\nПродолжить?"
m.scheduled_maintenance_warning="Игровые серверы сейчас находятся на техническом обслуживании.\nВ вашей игровой сессии возможны перебои, или вы можете вовсе не войти в игру.\n\nОбслуживание закончится в: {0}. (указано по вашему местному времени)\n\nУказанное время — официальная оценка, оно может измениться.\nПодробности смотрите на форумах игры."
m.invalid_additional_args_warning="Один или несколько аргументов JVM в настройке Дополнительных аргументов (Extra.txt) оказались недействительными.\n\nПерейдите в Настройки → Расширенное и проверьте их. Подробности смотрите в логах Knight Launcher.\n\nПри этом запуске все они будут проигнорированы."
m.invalid_additional_args_save_warning="Один или несколько аргументов JVM в настройке Дополнительных аргументов (Extra.txt) оказались недействительными и были принудительно сброшены по умолчанию.\n\nПерейдите в Настройки → Расширенное и проверьте их. Подробности смотрите в логах Knight Launcher."

