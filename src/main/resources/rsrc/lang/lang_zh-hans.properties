m.crucible_editor_warning="Crucible 编辑器由 Grey Havens 独家维护，本启动器未获得其认可，也与其无任何关联。\n这只是访问与游戏内相同编辑器的快捷方式。\n\n在游戏外使用 Crucible 编辑器不受官方支持...\n功能可能无法正常工作，请自行斟酌使用。\n\n你创作的任何内容都必须遵守 Coliseum Crucible 服务条款：\nhttps://wiki.spiralknights.com/Coliseum_Crucible_Terms_and_Conditions\n\n请确保你打算报告的任何问题都能在游戏内启动编辑器时复现。\n\n是否继续？"
m.scheduled_maintenance_warning="游戏服务器目前正处于维护时段。\n你的游戏会话可能会中断，或者可能完全无法登录。\n\n维护结束时间：{0}。（以你的本地时间显示）\n\n以上时间为官方估计，可能会有变动。\n请查看游戏论坛了解更多信息。"
