# Error messages
error.invalid_dir="请将 KnightLauncher.jar 放在 Spiral Knights 主目录中 {0}"
error.game_launch="游戏无法启动。\n\n建议尝试以下任一解决方法（不分先后）：\n- 在启动器设置的“游戏”选项卡中，点击“加载推荐设置”按钮。\n- 在启动器设置的“游戏”选项卡中，降低分配的内存。\n- 在启动器设置的“游戏”选项卡中，点击“恢复默认值”按钮。\n- 在启动器设置的“游戏”选项卡中，修补另一个 Java VM。\n\n如果仍然无法解决问题，你可以在 Discord 上寻求技术支持。\n\n通过 Discord 寻求帮助时，请务必附上你的所有日志文件。\n你可以通过启动器的 设置 → 关于 → 复制日志到剪贴板 自动获取所有日志，然后在 Discord 中按 CTRL + V 粘贴。"
error.start_location=".jar 文件似乎放在了错误的目录中。\n某些情况下这是误报，可以忽略。Knight Launcher 将尝试正常启动。\n如果此问题持续存在，请尝试在 Windows 上使用批处理文件（KnightLauncher_windows.bat），\n或在 OSX/Linux 上使用 Shell 文件（KnightLauncher_mac_linux.sh）。"
error.start_location_steam_path="\n此外，我们检测到以下 Steam 路径：\n{0}"
error.flamingo_offline="无法连接到 Flamingo。\n启动器的部分功能可能无法完全使用。"
error.no_compatible_jvm="没有可用于启动编辑器的兼容 Java VM。"
