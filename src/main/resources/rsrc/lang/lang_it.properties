m.scene_editor_legacy_warning="Non utilizzare questo Scene Editor legacy se intendi creare contenuti da inviare al programma Coliseum's Crucible.\nUsa invece il Crucible Editor accessibile in gioco.\n\nQuesto editor legacy potrebbe smettere di funzionare in qualsiasi momento e il supporto futuro non è garantito.\n\nVuoi procedere?"
m.crucible_editor_warning="Il Crucible Editor è gestito esclusivamente da Grey Havens, e questo launcher non ha alcuna approvazione o associazione.\nSi tratta semplicemente di un collegamento per accedere allo stesso editor disponibile in gioco.\n\nL'utilizzo del Crucible Editor al di fuori del gioco non è ufficialmente supportato...\nAlcune funzionalità potrebbero non funzionare correttamente; usalo a tuo rischio.\n\nQualsiasi creazione deve rispettare i Termini di Servizio del Coliseum Crucible:\nhttps://wiki.spiralknights.com/Coliseum_Crucible_Terms_and_Conditions\n\nAssicurati che eventuali bug da segnalare possano essere riprodotti lanciando l'editor in gioco.\n\nVuoi procedere?"
m.scheduled_maintenance_warning="I server di gioco sono attualmente in manutenzione.\nLa tua sessione di gioco potrebbe subire interruzioni, oppure potresti non riuscire ad accedere affatto.\n\nLa manutenzione termina alle: {0}. (mostrato nel tuo fuso orario locale)\n\nL’orario indicato è una stima ufficiale, ma potrebbe sempre variare.\nControlla i forum del gioco per ulteriori informazioni."
m.invalid_additional_args_warning="Uno o più argomenti JVM nelle tue impostazioni degli Argomenti aggiuntivi (Extra.txt) non sono validi.\n\nVai su Impostazioni → Avanzate e controllali. Leggi i log di Knight Launcher per maggiori informazioni.\n\nVerranno tutti ignorati per questo avvio."
m.invalid_additional_args_save_warning="Uno o più argomenti JVM nelle tue impostazioni degli Argomenti aggiuntivi (Extra.txt) non sono validi, e sono stati ripristinati ai valori predefiniti.\n\nVai su Impostazioni → Avanzate e controllali. Leggi i log di Knight Launcher per maggiori informazioni."

