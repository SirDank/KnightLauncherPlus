# Error messages
error.game_launch="تعذّر تشغيل اللعبة.\n\nيُنصح بتجربة أي من الحلول التالية دون ترتيب معيّن:\n- في تبويب \"اللعبة\" في إعدادات المشغّل اضغط على زر \"تحميل الإعدادات الموصى بها\".\n- قلّل الذاكرة المخصصة في تبويب \"اللعبة\" في إعدادات المشغّل.\n- في تبويب \"اللعبة\" في إعدادات المشغّل اضغط على زر \"إعادة القيم الافتراضية\".\n- قم بتصحيح Java VM آخر في تبويب \"اللعبة\" في إعدادات المشغّل.\n\nإذا لم يحل ذلك مشكلتك، يمكنك طلب الدعم الفني على Discord.\n\nعند طلب المساعدة عبر Discord تأكد من إرفاق جميع ملفات السجلات.\nيمكنك الحصول على جميع السجلات تلقائيًا من الإعدادات ← حول ← نسخ السجلات إلى الحافظة، ثم الضغط على CTRL + V في Discord."
error.start_location="يبدو أن ملف .jar موضوع في المجلد الخطأ.\nفي بعض الحالات يكون هذا إنذارًا خاطئًا ويمكن تجاهله. سيحاول Knight Launcher التشغيل بشكل طبيعي.\nإذا استمر ذلك، جرّب استخدام ملف Batch (KnightLauncher_windows.bat) على Windows\nأو ملف Shell (KnightLauncher_mac_linux.sh) على OSX/Linux."
error.start_location_steam_path="\nبالإضافة إلى ذلك، اكتشفنا مسار Steam التالي: \n{0}"
error.flamingo_offline="تعذّر الاتصال بـ Flamingo.\nقد لا تكون بعض وظائف المشغّل متاحة بالكامل."
error.folders_within_mods_folder="توجد مجلدات داخل مجلد التعديلات.\nلا تحتاج إلى استخراج ملف .zip، فقط اسحب ملف .zip وأفلته داخل مجلد التعديلات."
