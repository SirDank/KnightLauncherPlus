m.scene_editor_legacy_warning="لا تستخدم محرر المشاهد القديم هذا لإنشاء محتوى تنوي تقديمه لبرنامج Crucible في الكولوسيوم.\nاستخدم بدلًا من ذلك محرر Crucible المتاح داخل اللعبة.\n\nقد يتوقف هذا المحرر القديم عن العمل في أي لحظة، ولا يوجد ضمان لدعمه مستقبلًا.\n\nهل تريد المتابعة؟"
m.crucible_editor_warning="تتم صيانة محرر Crucible حصريًا بواسطة Grey Havens، وهذا المشغّل غير معتمد منهم وغير مرتبط بهم.\nهذا مجرد اختصار للوصول إلى نفس المحرر الذي تفتحه داخل اللعبة.\n\nاستخدام محرر Crucible من خارج اللعبة غير مدعوم رسميًا...\nقد تعمل الأمور بشكل صحيح وقد لا تعمل، استخدمه وفق تقديرك الخاص.\n\nيجب أن تلتزم جميع إبداعاتك بشروط خدمة Coliseum Crucible:\nhttps://wiki.spiralknights.com/Coliseum_Crucible_Terms_and_Conditions\n\nتأكد من أن أي أخطاء تنوي الإبلاغ عنها يمكن إعادة إنتاجها عند تشغيل المحرر من داخل اللعبة.\n\nهل تريد المتابعة؟"
m.scheduled_maintenance_warning="خوادم اللعبة حاليًا في فترة صيانة.\nقد تواجه جلسة اللعب انقطاعات، أو قد لا تتمكن من تسجيل الدخول إطلاقًا.\n\nتنتهي الصيانة في: {0}. (معروض بتوقيتك المحلي)\n\nالوقت أعلاه تقدير رسمي، لكنه قد يتغير دائمًا.\nيرجى مراجعة منتديات اللعبة لمزيد من المعلومات."
m.invalid_additional_args_warning="تم العثور على معامل JVM واحد أو أكثر غير صالح في إعداد المعاملات الإضافية (Extra.txt).\n\nيرجى الانتقال إلى الإعدادات ← متقدم ومراجعتها. اطّلع على سجلات Knight Launcher لمزيد من المعلومات.\n\nسيتم تجاهلها جميعًا في هذا التشغيل."
m.invalid_additional_args_save_warning="تم العثور على معامل JVM واحد أو أكثر غير صالح في إعداد المعاملات الإضافية (Extra.txt)، وتمت إعادتها إلى القيم الافتراضية.\n\nيرجى الانتقال إلى الإعدادات ← متقدم ومراجعتها. اطّلع على سجلات Knight Launcher لمزيد من المعلومات."

