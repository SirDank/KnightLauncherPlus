# Error messages
error.game_launch="Le jeu n’a pas pu se lancer.\n\nIl est recommandé d’essayer l’une des solutions suivantes, dans n’importe quel ordre :\n- Dans l’onglet \"Jeu\" des paramètres du launcher, appuyez sur le bouton \"Charger les paramètres recommandés\".\n- Réduisez la mémoire allouée dans l’onglet \"Jeu\" des paramètres du launcher.\n- Dans l’onglet \"Jeu\" des paramètres du launcher, appuyez sur le bouton \"Réinitialiser les valeurs par défaut\".\n- Patchez une autre Java VM dans l’onglet \"Jeu\" des paramètres du launcher.\n\nSi cela ne résout toujours pas votre problème, vous pouvez demander de l’aide technique sur Discord.\n\nLorsque vous demandez de l’aide sur Discord, pensez à joindre TOUS vos fichiers de logs.\nVous pouvez obtenir TOUS vos logs automatiquement via Paramètres → À propos → Copier les logs dans le presse-papiers, puis en appuyant sur CTRL + V sur Discord."
error.start_location="Le fichier .jar semble être placé dans le mauvais dossier.\nDans certains cas il s’agit d’un faux positif qui peut être ignoré. Knight Launcher va tenter de se lancer normalement.\nSi cela persiste, essayez d’utiliser le fichier Batch (KnightLauncher_windows.bat) sous Windows\nou le fichier Shell (KnightLauncher_mac_linux.sh) sous OSX/Linux."
error.start_location_steam_path="\nDe plus, nous avons détecté le chemin Steam suivant : \n{0}"
error.flamingo_offline="Impossible de se connecter à Flamingo.\nCertaines fonctionnalités du launcher pourraient ne pas être entièrement disponibles."
error.folders_within_mods_folder="Le dossier des mods contient des dossiers.\nVous n’avez pas besoin d’extraire le fichier .zip, glissez-déposez simplement le fichier .zip dans le dossier des mods."
error.unsupported_64bit="Votre système ne prend pas en charge le patch d’une Java VM 64 bits."
error.not_supported="Non pris en charge."
error.launcher_already_running="Knight Launcher est déjà en cours d’exécution.\nCherchez-le dans votre barre des tâches ou dans la zone de notification."
error.game_already_running_launch="Spiral Knights est déjà en cours d’exécution.\nPour lancer un autre client, maintenez la touche ALT (touche OPTION sur macOS) ou MAJ enfoncée en appuyant sur Jouer pour lancer en mode Alt."
error.mod_file_format="Seules les extensions de fichier .zip, .jar et .modpack sont prises en charge, veuillez réessayer."

