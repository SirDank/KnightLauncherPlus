m.scene_editor_legacy_warning="N’utilisez pas cet ancien Éditeur de scènes pour créer du contenu que vous comptez soumettre au programme Crucible du Colisée.\nUtilisez plutôt l’Éditeur Crucible accessible en jeu.\n\nCet ancien éditeur peut cesser de fonctionner à tout moment et son support futur n’est pas garanti.\n\nVoulez-vous continuer ?"
m.crucible_editor_warning="L’Éditeur Crucible est maintenu exclusivement par Grey Havens, et ce launcher n’a aucune approbation ni association avec eux.\nIl s’agit simplement d’un raccourci vers le même éditeur que celui accessible en jeu.\n\nL’utilisation de l’Éditeur Crucible en dehors du jeu n’est pas officiellement prise en charge...\nLes choses peuvent fonctionner ou non correctement, utilisez-le à votre propre discrétion.\n\nToutes vos créations doivent respecter les Conditions d’utilisation du Coliseum Crucible :\nhttps://wiki.spiralknights.com/Coliseum_Crucible_Terms_and_Conditions\n\nAssurez-vous que les bugs que vous comptez signaler peuvent être reproduits en lançant l’éditeur depuis le jeu.\n\nVoulez-vous continuer ?"
m.scheduled_maintenance_warning="Les serveurs du jeu sont actuellement en maintenance.\nVotre session de jeu peut subir des interruptions, ou vous pourriez ne pas pouvoir vous connecter du tout.\n\nFin de la maintenance : {0}. (affichée dans votre heure locale)\n\nL’heure ci-dessus est une estimation officielle, mais elle peut toujours varier.\nConsultez les forums du jeu pour plus d’informations."
m.invalid_additional_args_warning="Un ou plusieurs arguments JVM de votre paramètre Arguments supplémentaires (Extra.txt) sont invalides.\n\nAllez dans Paramètres → Avancé pour les vérifier. Consultez les logs de Knight Launcher pour plus d’informations.\n\nIls seront tous ignorés pour ce lancement."
m.invalid_additional_args_save_warning="Un ou plusieurs arguments JVM de votre paramètre Arguments supplémentaires (Extra.txt) sont invalides, et ils ont été réinitialisés aux valeurs par défaut.\n\nAllez dans Paramètres → Avancé pour les vérifier. Consultez les logs de Knight Launcher pour plus d’informations."

