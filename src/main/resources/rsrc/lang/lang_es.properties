# Error messages
error.game_launch="El juego no pudo iniciarse.\n\nSe recomienda probar cualquiera de las siguientes soluciones, en ningún orden en particular:\n- En la pestaña \"Juego\" de los ajustes del launcher, presiona el botón \"Cargar ajustes recomendados\".\n- Reduce la memoria asignada en la pestaña \"Juego\" de los ajustes del launcher.\n- En la pestaña \"Juego\" de los ajustes del launcher, presiona el botón \"Restablecer valores por defecto\".\n- Parchea otra Java VM en la pestaña \"Juego\" de los ajustes del launcher.\n\nSi esto aún no soluciona tu problema, puedes buscar soporte técnico en Discord.\n\nAl pedir ayuda en Discord asegúrate de adjuntar TODOS tus archivos de log.\nPuedes obtener TODOS tus logs automáticamente entrando en Ajustes → Acerca → Copiar logs al portapapeles, y luego presionando CTRL + V en Discord."
error.start_location="El archivo .jar parece estar ubicado en el directorio incorrecto.\nEn algunos casos esto se debe a un falso positivo y puede ignorarse. Knight Launcher intentará iniciarse con normalidad.\nSi esto persiste, prueba usando el archivo Batch (KnightLauncher_windows.bat) en Windows\no el archivo Shell (KnightLauncher_mac_linux.sh) en OSX/Linux."
error.start_location_steam_path="\nAdemás, hemos detectado la siguiente ruta de Steam: \n{0}"
error.flamingo_offline="No se pudo conectar con Flamingo.\nAlgunas funcionalidades del launcher podrían no estar disponibles por completo."
error.folders_within_mods_folder="Hay carpetas dentro de la carpeta de mods.\nNo necesitas extraer el archivo .zip, simplemente arrastra y suelta el archivo .zip dentro de la carpeta de mods."
error.unsupported_64bit="Tu sistema no soporta el parcheo de una Java VM de 64 bits."
error.not_supported="No soportado."
error.launcher_already_running="Knight Launcher ya se está ejecutando.\nBúscalo en tu barra de tareas o en la bandeja del sistema."
error.game_already_running_launch="Spiral Knights ya se está ejecutando.\nPara iniciar otro cliente, mantén presionada la tecla ALT (OPTION en macOS) o SHIFT mientras presionas Jugar para iniciar en Modo Alt."
error.mod_file_format="Solo se soportan archivos con extensión .zip, .jar y .modpack, por favor inténtalo de nuevo."

