# Error messages
error.game_launch="The game was not able to launch.\n\nIt's recommended to try any of the following solutions in no particular order:\n- In the \"Game\" tab in the launcher's settings press the \"Load recommended settings\" button.\n- Lower the allocated memory in the \"Game\" tab in launcher's settings.\n- In the \"Game\" tab in the launcher's settings press the \"Reset values to default\" button.\n- Patch another Java VM in the \"Game\" tab in launcher's settings.\n\nIf this does still not solve your issue you can look for technical support on Discord.\n\nWhen submitting a request for help through Discord make sure to attach ALL your log files with it.\nYou can get ALL your logs automatically by entering the launcher's Settings → About → Copy Logs to Clipboard, and then press CTRL + V on Discord."
error.start_location="The .jar file appears to be placed in the wrong directory.\nIn some cases this is due to a false positive and can be ignored. Knight Launcher will attempt to launch normally.\nIf this persists try using the Batch (KnightLauncher_windows.bat) file for Windows\nor the Shell (KnightLauncher_mac_linux.sh) file for OSX/Linux."
error.start_location_steam_path="\nAdditionally, we’ve detected the following Steam path: \n{0}"
error.flamingo_offline="Could not connect to Flamingo.\nSome launcher functionalities might not be fully available."
error.folders_within_mods_folder="There are folders within the mods folder.\nYou do not need to extract the .zip file, simply drag and drop the .zip file inside the mods folder."
error.unsupported_64bit="Your system does not support 64-bit Java VM patching."
error.not_supported="Not supported."
error.launcher_already_running="Knight Launcher is already running.\nLook for it in your taskbar or system tray."
error.game_already_running_launch="Spiral Knights is already running.\nTo launch another client, keep the ALT key (OPTION key for macOS) or SHIFT key pressed while pressing Play to launch in Alt Mode."
error.mod_file_format="Only .zip, .jar and .modpack file extensions are supported, please try again."

